name: Update Pinterest Competitors

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_username:
        description: 'Username (empty = all active)'
        type: string
        required: false
      dry_run:
        description: 'Dry-run mode'
        type: boolean
        required: false
        default: false
      force_run:
        description: 'Override pipeline disabled (use with caution)'
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [update-competitor]

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.COMPETITORS_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COMPETITORS_SUPABASE_SERVICE_KEY }}
      TOKEN_KEK: ${{ secrets.TOKEN_KEK }}
      WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
      GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
      GITHUB_REPO: ${{ secrets.GITHUB_REPO || 'sayfedin-star/pinorbit-v2' }}
      JOB_ID: ${{ github.event.client_payload.job_id || '' }}
      TARGET_USERNAME: ${{ github.event.client_payload.username || github.event.inputs.target_username || '' }}
      DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.client_payload.dry_run == true) && 'true' || '' }}
      FORCE_RUN: ${{ (github.event.inputs.force_run == true || github.event.client_payload.force_run == true) && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js --no-save
      - run: node scripts/update-competitors.mjs
