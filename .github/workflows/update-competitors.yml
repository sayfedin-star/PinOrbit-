name: Update Pinterest Competitors

on:
  schedule:
    - cron: '*/5 * * * *'   # Poller: adopts dashboard-queued jobs (<=5min, no PAT)
    - cron: '0 2 * * *'     # Daily full sync (all active workspaces)
  workflow_dispatch:
    inputs:
      target_username: { description: 'Username (empty = all active)', type: string, required: false }
      dry_run: { description: 'Dry-run mode', type: boolean, required: false, default: false }
      force_run: { description: 'Override pipeline-disabled', type: boolean, required: false, default: false }

jobs:
  poll-queued:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    env:
      POLL_QUEUED: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save
      - run: node scripts/update-competitors.mjs

  sync:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
      TARGET_USERNAME: ${{ github.event.inputs.target_username || '' }}
      DRY_RUN: ${{ (github.event.inputs.dry_run == true) && 'true' || '' }}
      FORCE_RUN: ${{ (github.event.inputs.force_run == true) && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install @supabase/supabase-js --no-save
      - run: node scripts/update-competitors.mjs
